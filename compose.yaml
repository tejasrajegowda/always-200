# The database password is a local-only demo value. Postgres publishes no host
# port, so it is reachable only on this Compose network.
name: always-200

x-http-health: &http-health # each app answers GET /healthz once it is really listening
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
  interval: 5s
  retries: 20

services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_USER: shop, POSTGRES_PASSWORD: shop-local-only, POSTGRES_DB: shop}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./patient/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U shop"], interval: 5s, retries: 20}

  payments:
    build: .
    image: always-200-patient
    command: ["uvicorn", "patient.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment: {SERVICE: payments, DATABASE_URL: "postgresql://shop:shop-local-only@postgres/shop"}
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: *http-health
    restart: "no"  # dev stack: never auto-start when the engine starts; steps bring it up and stop it
    ports: ["127.0.0.1:8003:8000"]

  orders:
    build: .
    image: always-200-patient
    command: ["uvicorn", "patient.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      {
        SERVICE: orders,
        DATABASE_URL: "postgresql://shop:shop-local-only@postgres/shop",
        DOWNSTREAM_URL: "http://payments:8000",
      }
    depends_on: {postgres: {condition: service_healthy}, payments: {condition: service_healthy}}
    healthcheck: *http-health
    restart: "no"  # dev stack: never auto-start when the engine starts; steps bring it up and stop it
    ports: ["127.0.0.1:8002:8000"]

  storefront:
    build: .
    image: always-200-patient
    command: ["uvicorn", "patient.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment: {SERVICE: storefront, DOWNSTREAM_URL: "http://orders:8000"}
    depends_on: {orders: {condition: service_healthy}}
    healthcheck: *http-health
    restart: "no"  # dev stack: never auto-start when the engine starts; steps bring it up and stop it
    ports: ["127.0.0.1:8001:8000"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-admin-api
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    # Host 9090 is already taken. Inside the Compose network the port stays 9090.
    ports: ["127.0.0.1:9091:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Host 3000 is already taken. Inside the container Grafana still listens on 3000.
    ports: ["127.0.0.1:3002:3000"]

  traffic:
    build: .
    image: always-200-patient
    profiles: ["traffic"]
    # No flag string: Compose would hand "--quick --soak-min 60" over as one argument.
    command: ["python", "-m", "traffic"]
    environment:
      SEEDS: "${SEEDS:-dev}"
      QUICK: "${QUICK:-0}" # "1" only for quick runs; a full run never gets --quick
      SOAK_MIN: "${SOAK_MIN:-}"
    depends_on: {storefront: {condition: service_healthy}}
    ports: ["127.0.0.1:9100:9100"]

  always-200:
    build: .
    image: always-200-patient
    profiles: ["watch"]
    # Inside the Compose network Prometheus is still on 9090. The host publish is 9091.
    command: ["python", "-m", "always_200", "watch", "--prometheus", "http://prometheus:9090"]
    ports: ["127.0.0.1:9200:9200"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file: [{path: .env, required: false}]
    depends_on:
      prometheus: {condition: service_started}
      storefront: {condition: service_healthy}
    restart: "no"  # dev stack: never auto-start when the engine starts; steps bring it up and stop it

volumes:
  pg-data: {}
  prom-data: {name: "always-200-prom-${RUN:-live}"}
